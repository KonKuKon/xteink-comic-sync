name: XTEINK Cloud Comic Sync (Manual Only - TV Box handles Auto Sync)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install curl_cffi

      - name: Run Comic Sync Engine
        run: |
          python sync_comics.py

      - name: Publish Cloud Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "XTEINK Comic Latest Feed"
          body: "Automated cloud comic sync for ASUS ZenFone XTEINK"
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
